services:
  backend:
    build:
      context: ./sca-backend
      dockerfile: Dockerfile.prod
    ports:
      - "3000:3000"
    volumes:
      - ./sca-backend:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    restart: always
    networks:
      - cronos-network

  frontend:
    build:
      context: ./sca-frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    volumes:
      - ./sca-frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    depends_on:
      - backend
    restart: always
    networks:
      - cronos-network

networks:
  cronos-network:
    driver: bridge
    name: cronos_prod_network
